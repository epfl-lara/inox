name = "InoxCertificatesVerification"
version = "0.1.0"
srcDir = ".."
defaultTargets = ["InoxVerification"]

# The verification project of Logos: the semantics of SMT-LIB that its theorem is about, which
# needs Mathlib, and its proofs, which take hours to build. It brings the checker of Logos that
# the certificate checker is built on.
[[require]]
name = "LogosVerification"
git = "https://github.com/cvc5/logos"
rev = "33c7e71cd19f7d462895cf5f6c67d4ffbe059351"
subDir = "verification"

# The semantics of Inox, generated from semantics.md (proofs/semantics).
[[require]]
name = "InoxSemantics"
path = "../../semantics"

# The modules of proofs/lean, listed rather than given by their root `Inox`, which would make
# `Inox.Semantics`, of the package InoxSemantics, a module of this package.
[[lean_lib]]
name = "Inox"
roots = []
globs = ["Inox.Sexp", "Inox.Lowering", "Inox.Checker", "Inox.Accept", "Inox.Terms", "Inox.Meanings"]

# The theorems, given the soundness of Logos: they only need the definitions of Logos, and its
# proof that a well-formed model exists.
[[lean_lib]]
name = "InoxVerification"
roots = []
globs = ["Inox.Correct", "Inox.NoModel", "Inox.Fresh", "Inox.Extend", "Inox.RuleSteps", "Inox.Unfold", "Inox.Instances", "Inox.Relative", "Inox.Model", "Inox.Codes", "Inox.Mono", "Inox.Data", "Inox.Bridge", "Inox.Reach", "Inox.NoSolution", "Inox.Source", "Inox.Reached"]

# The theorems with the soundness of Logos discharged by its own theorem: `lake build InoxClosed`
# builds the proofs of Logos.
[[lean_lib]]
name = "InoxClosed"
roots = []
globs = ["Inox.Closed"]

# The command that says of which certificates `no_solution_of_reached` holds: its checks are
# defined over the semantics, so it is of this package. `lake build inox-solution` compiles the
# modules that it imports, those of Mathlib too, which takes a quarter of an hour the first time.
[[lean_exe]]
name = "inox-solution"
root = "SolutionMain"
