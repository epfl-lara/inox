# Options for building a GraalVM native image of the inox command line
# (see scripts/build-native-image.sh). reachability-metadata.json lists the
# reflection and resources Inox needs: the binary serializer, the Z3 native
# interface (whose JNI libraries are extracted from lib-bin/) and Princess.
# The next two silence JDK warnings about Z3's JNI loading and the Scala 3
# runtime's use of sun.misc.Unsafe (lazy vals). The last three leave the
# Princess and Eldarica back ends out of the image (see NativeImageFlags),
# which halves the code it compiles; drop them to include those back ends.
Args = --no-fallback \
       --enable-native-access=ALL-UNNAMED \
       -Dsun.misc.unsafe.memory.access=allow \
       --initialize-at-build-time=inox.solvers.NativeImageFlags \
       -Dinox.withoutPrincess=true \
       -Dinox.withoutEldarica=true
