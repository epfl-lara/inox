# Options for building a GraalVM native image of the inox command line
# (see scripts/build-native-image.sh). reachability-metadata.json, next to
# this file, lists what Inox reaches by name: the Z3 native interface, whose
# JNI code reads fields of Z3's Java bindings, and the Z3 libraries that it
# extracts from lib-bin/. native-image resolves the other lookups itself,
# such as those of the Scala 3 lazy vals, whose names are constants.
# scripts/build-native-image.sh also passes --exact-reachability-metadata
# (which a jar on the class path can't set for all its code here).
# The next two silence JDK warnings about Z3's JNI loading and the Scala 3
# runtime's use of sun.misc.Unsafe. The last three leave the Princess and
# Eldarica back ends out of the image (see NativeImageFlags), which halves
# the code it compiles; to include them, drop these options and add what
# they reach to the metadata (scripts/record-native-image-metadata.sh).
Args = --no-fallback \
       --enable-native-access=ALL-UNNAMED \
       -Dsun.misc.unsafe.memory.access=allow \
       --initialize-at-build-time=inox.solvers.NativeImageFlags \
       -Dinox.withoutPrincess=true \
       -Dinox.withoutEldarica=true
