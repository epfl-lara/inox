name: Inox coverage
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      INSTALL_SOLVERS: 1
      Z3_VER: 4.15.1
      CVC4_VER: 1.8
      CVC5_VER: 1.2.1
      BITWUZLA_VER: 0.8.2
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: sbt
    - name: Set Java and SBT options
      run: |
        echo "XDG_RUNTIME_DIR=$(realpath ..)" >> $GITHUB_ENV
        JAVA_OPTS_TMP_DIR=./tmp_java
        JAVA_OPTS="-Xss64M -Xms1024M -Xmx8G -Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR"
        echo "JAVA_OPTS_TMP_DIR=$JAVA_OPTS_TMP_DIR" >> $GITHUB_ENV
        echo "JAVA_OPTS=$JAVA_OPTS" >> $GITHUB_ENV
        echo "JVM_OPTS=$JAVA_OPTS" >> $GITHUB_ENV
        echo "SBT_OPTS=-Dsbt.global.base=$GITHUB_WORKSPACE/.sbt-global" >> $GITHUB_ENV
    - name: Install and set up sbt
      run: |
        ./scripts/install_sbt.sh
        echo "$(pwd)/sbt/bin/" >> $GITHUB_PATH
    - name: Prepare temp folder
      run: rm -rf $JAVA_OPTS_TMP_DIR && mkdir -p $JAVA_OPTS_TMP_DIR
    - name: Install solvers
      run: ./scripts/install_solvers.sh $GITHUB_WORKSPACE/.local/bin $Z3_VER $CVC4_VER $CVC5_VER $BITWUZLA_VER
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Add solvers to PATH
      run: echo "$GITHUB_WORKSPACE/.local/bin" >> $GITHUB_PATH
    # Unit and integration tests run in separate JVMs, as the native Z3 library
    # can only be loaded by one test class loader per JVM.
    - name: Run tests with coverage
      run: sbt -Dtest-parallelism=4 -batch coverage test
    - name: Run integration tests with coverage
      run: sbt -Dtest-parallelism=4 -batch coverage it:test
    - name: Generate coverage report
      if: ${{ !cancelled() }}
      run: |
        sbt -batch coverageReport
        python3 scripts/coverage_summary.py target/scala-*/scoverage-report/scoverage.xml >> $GITHUB_STEP_SUMMARY
    - name: Upload coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          target/scala-*/scoverage-report/
          target/scala-*/coverage-report/cobertura.xml
    - name: Clean up
      run: rm -rf $JAVA_OPTS_TMP_DIR
