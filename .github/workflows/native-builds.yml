name: Native builds
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Cancel a pull request's superseded runs when new commits are pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Builds the two native versions of the inox command line and checks their
# answers on the TIP regression files (scripts/check-native-binary.sh). The
# GraalVM build records its reachability metadata over the TIP regression
# files (scripts/record-native-image-metadata.sh) and uploads it. The coverage
# comment workflow lists how it differs from main on the pull request.
jobs:
  scala-native:
    name: Scala Native
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INSTALL_SOLVERS: 1
      Z3_VER: 4.15.1
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
    - name: Install and set up sbt
      run: |
        ./scripts/install_sbt.sh
        echo "$(pwd)/sbt/bin/" >> $GITHUB_PATH
        echo "SBT_OPTS=-Xss64M -Xmx4G -Dsbt.global.base=$GITHUB_WORKSPACE/.sbt-global" >> $GITHUB_ENV
    - name: Install Z3
      run: |
        ./scripts/install_solvers.sh $GITHUB_WORKSPACE/.local/bin $Z3_VER
        echo "$GITHUB_WORKSPACE/.local/bin" >> $GITHUB_PATH
    - name: Build
      run: cd native && sbt -batch nativeLink
    - name: Check answers
      run: ./scripts/check-native-binary.sh native/target/scala-*/inox-native --solvers=smt-z3

  graalvm:
    name: GraalVM native image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      INSTALL_SOLVERS: 1
      Z3_VER: 4.15.1
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup GraalVM
      uses: graalvm/setup-graalvm@v1
      with:
        distribution: graalvm-community
        java-version: 25
    - name: Install and set up sbt
      run: |
        ./scripts/install_sbt.sh
        echo "$(pwd)/sbt/bin/" >> $GITHUB_PATH
        echo "SBT_OPTS=-Xss64M -Xmx4G -Dsbt.global.base=$GITHUB_WORKSPACE/.sbt-global" >> $GITHUB_ENV
    - name: Install Z3
      run: |
        ./scripts/install_solvers.sh $GITHUB_WORKSPACE/.local/bin $Z3_VER
        echo "$GITHUB_WORKSPACE/.local/bin" >> $GITHUB_PATH
    - name: Build
      run: ./scripts/build-native-image.sh inox-native-image
    - name: Note the pull request
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      # Read by the coverage comment workflow, which compares the metadata
      # with that of main at the first parent of the merge this build tested.
      # (Read from the commit itself, since the checkout is shallow.)
      run: |
        [ -d target/native-image-metadata ] || exit 0
        echo "$PR_NUMBER" > target/native-image-metadata/pr-number
        git cat-file -p HEAD | sed -n '/^parent /{s///p;q}' > target/native-image-metadata/base-sha
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
    - name: Upload the reachability metadata
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: graalvm-reachability-metadata
        path: target/native-image-metadata/
        if-no-files-found: ignore
    - name: Check answers (SMT-LIB Z3)
      run: ./scripts/check-native-binary.sh ./inox-native-image --solvers=smt-z3
    - name: Check answers (native Z3 interface)
      run: ./scripts/check-native-binary.sh ./inox-native-image --solvers=nativez3
