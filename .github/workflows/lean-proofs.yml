name: Lean proofs
# The theorems of the certificate checker in Lean (proofs/lean/verification), and the semantics
# generated from proofs/semantics.md (proofs/semantics) that they are about, when either changes.
# They take the soundness of Logos as a hypothesis, and so only need its definitions, its proof
# that a well-formed model exists, and Mathlib, from its cache. Run by hand with `closed`, the
# workflow also builds the proofs of Logos, which take hours, to check the theorems without that
# hypothesis: once for each version of Logos is enough, and Logos checks its proofs itself.
on:
  workflow_dispatch:
    inputs:
      closed:
        description: Also build the proofs of Logos (hours)
        type: boolean
        default: false
  pull_request:
    paths:
      - 'proofs/lean/**'
      - 'proofs/semantics/**'
      - 'proofs/semantics.md'
      - '.github/workflows/lean-proofs.yml'
  push:
    branches:
      - main
    paths:
      - 'proofs/lean/**'
      - 'proofs/semantics/**'
      - 'proofs/semantics.md'
      - '.github/workflows/lean-proofs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semantics:
    name: Semantics (Lean)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    # Lean checks that the generated definitions are total
    - name: Build the Lean semantics
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: proofs/semantics

  proofs:
    name: Lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Build the theorems
      uses: leanprover/lean-action@v1
      with:
        lake-package-directory: proofs/lean/verification
    # only its module: linking the executable compiles every module that it imports, Mathlib's
    # included, to C, which takes longer than the theorems
    - name: Build the command that runs their checks
      working-directory: proofs/lean/verification
      run: lake build +SolutionMain
    - name: Build them on the proofs of Logos
      if: ${{ inputs.closed }}
      working-directory: proofs/lean/verification
      run: lake build InoxClosed
