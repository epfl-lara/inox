name: Inox CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Cancel a pull request's superseded runs when new commits are pushed.
# Runs on main are never cancelled, so every merge still gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: ${{ matrix.runners.name }} / JDK ${{ matrix.java-version }}
    runs-on: ${{ matrix.runners.labels }}
    strategy:
      fail-fast: false
      # Linux / JDK 17 runs in the Inox coverage workflow, with coverage
      # measurements, so that the coverage comment doesn't wait for these jobs.
      matrix:
        include:
          - runners: {name: Linux, os: Linux, labels: ['ubuntu-latest']}
            java-version: 21
          - runners: {name: macOS ARM64, os: macOS, labels: ['macos-latest']}
            java-version: 17
          - runners: {name: macOS ARM64, os: macOS, labels: ['macos-latest']}
            java-version: 21
    env:
      # solver versions to test against
      INSTALL_SOLVERS: 1
      Z3_VER: 5.4.1
      CVC4_VER: 1.8
      CVC5_VER: 1.2.1
      BITWUZLA_VER: 0.8.2
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Setup JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: ${{ matrix.java-version }}
    - name: Set Java and SBT options
      run: |
        # path for sbt to create a local folder and sockets
        # needs to be a bit shallower than the workspace
        # to avoid unix socket path length limits
        echo "XDG_RUNTIME_DIR=$(realpath ..)" >> $GITHUB_ENV
        # java options for sbt
        JAVA_OPTS_TMP_DIR=./tmp_java
        JAVA_OPTS="-Xss64M -Xms1024M -Xmx8G -Djava.io.tmpdir=$JAVA_OPTS_TMP_DIR"
        echo "JAVA_OPTS_TMP_DIR=$JAVA_OPTS_TMP_DIR" >> $GITHUB_ENV
        echo "JAVA_OPTS=$JAVA_OPTS" >> $GITHUB_ENV
    - name: Install sbt
      uses: ./.github/actions/install-sbt
    - name: Set sbt global base
      # scala-smtlib is fetched via sbt's RootProject(uri(...)), which clones
      # and compiles it into the sbt global staging directory. On self-hosted
      # runners this directory is shared across runners and persists across
      # runs, causing stale .tasty/.class files and race conditions between
      # concurrent jobs. Isolating sbt's global base per workspace avoids
      # this. Can be reverted if scala-smtlib is published to Maven.
      run: echo "SBT_OPTS=-Dsbt.global.base=$GITHUB_WORKSPACE/.sbt-global" >> $GITHUB_ENV
    - name: Prepare temp folder
      run: rm -rf $JAVA_OPTS_TMP_DIR && mkdir -p $JAVA_OPTS_TMP_DIR
    - name: Fetch sbt dependencies
      uses: ./.github/actions/sbt-dependencies
      with:
        key: inox
        sbt-args: update Test/update IntegrationTest/update
    - name: Install solvers
      uses: ./.github/actions/install-solvers
      with:
        z3: ${{ env.Z3_VER }}
        cvc4: ${{ env.CVC4_VER }}
        cvc5: ${{ env.CVC5_VER }}
        bitwuzla: ${{ env.BITWUZLA_VER }}
    - name: Test solver availability
      run: cvc5 --version && z3 --version && cvc4 --version && bitwuzla --version
    - name: Run Tests
      run: sbt -Dtest-parallelism=10 -Dinox.require-solvers=smt-z3,smt-cvc4,smt-cvc5,smt-bitwuzla,princess -batch test
    - name: Run integration tests
      run: sbt -Dtest-parallelism=10 -batch IntegrationTest/test
    # Read by the coverage comment workflow, which compares the duration of
    # each test of a pull request build with that of main in the same job.
    - name: Collect test durations
      if: ${{ !cancelled() }}
      run: |
        mkdir -p test-timings
        python3 scripts/test_timings.py collect test-timings/timings.json target
        git rev-parse HEAD > test-timings/tested-sha
        echo "$REQUESTED_PRS" > test-timings/merged-prs
        if [ -n "$PR_NUMBER" ]; then
          echo "$PR_NUMBER" > test-timings/pr-number
          echo "$PR_HEAD_SHA" > test-timings/pr-head-sha
          git cat-file -p HEAD | awk '/^parent /{print $2; exit}' > test-timings/base-sha
        fi
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REQUESTED_PRS: ${{ inputs.prs }}
    - name: Upload test durations
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: test-timings-${{ matrix.runners.os }}-jdk${{ matrix.java-version }}
        path: test-timings/
    - name: Clean up
      run: rm -rf $JAVA_OPTS_TMP_DIR
