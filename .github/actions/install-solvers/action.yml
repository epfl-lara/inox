name: Install solvers
description: >
  Fetches and verifies the solvers pinned in solvers.json and puts them on PATH.
  Caches the original downloads by manifest and installer content.
inputs:
  stainless-dir:
    description: >
      A Stainless checkout, relative to the workspace. When set, its
      stainless-ci.sh still owns solver installation.
    default: ''
runs:
  using: composite
  steps:
    - name: Restore solver downloads
      id: cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.stainless-dir != '' && '.local/bin' || '.cache/inox-solvers' }}
        key: >-
          solvers-${{ runner.os }}-${{ runner.arch }}-${{
          inputs.stainless-dir != ''
          && format('stainless-{0}', hashFiles(format('{0}/stainless-ci.sh', inputs.stainless-dir)))
          || hashFiles('solvers.json', 'scripts/fetch-solvers.sh') }}
    - name: Fetch and verify solvers
      if: inputs.stainless-dir == ''
      shell: bash
      run: ./scripts/fetch-solvers.sh "$GITHUB_WORKSPACE/.local/bin" "$GITHUB_WORKSPACE/.cache/inox-solvers"
    - name: Install solvers (Stainless)
      if: steps.cache.outputs.cache-hit != 'true' && inputs.stainless-dir != ''
      shell: bash
      working-directory: ${{ inputs.stainless-dir }}
      run: ./stainless-ci.sh --install-solvers "$GITHUB_WORKSPACE/.local/bin"
    - name: Add solvers to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.local/bin" >> "$GITHUB_PATH"
